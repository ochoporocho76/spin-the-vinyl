<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a1420">
<meta name="description" content="Spin The Vinyl: vidriera de discos para vendedores de Argentina">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<title>Spin The Vinyl</title>
<style>
:root{--p1:#e8607a;--p2:#ffb38a;--p3:#ffd6b8;--p4:#8c2a3d;--p5:#ffc9a0;--bg:#4a1420;--card:#5c1b2a;--fg:#fff3ec;--muted:#e8b9b5;--line:#6e2a3a;--radius:14px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Montserrat,system-ui,sans-serif;color:var(--fg);background:var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{text-align:center;padding:16px 16px 4px}
.logo{width:170px;height:170px;display:block;margin:0 auto;border-radius:28px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--line)}
.tab{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);padding:10px 4px;border-radius:999px;font:inherit;font-weight:500;font-size:.8rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--p1),var(--p2));color:#2a0b14;border-color:transparent;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:14px}
.view{display:none}.view.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
h2{font-weight:300;font-size:1rem;letter-spacing:4px;text-transform:uppercase;color:var(--p3);margin:0 0 12px}
.search{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:#3a1019;color:var(--fg);font:inherit;font-size:1rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
label{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{background:#3a1019;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.95rem;width:100%}
input:focus,select:focus{outline:2px solid var(--p2);border-color:transparent}
.fileBox{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--p2);border-radius:12px;padding:12px;font-size:.78rem;color:var(--muted)}
.fileBox span{color:var(--p3);font-weight:500}
.fileBox input[type=file]{font-size:.75rem;padding:6px;color:var(--muted)}
.fileBox small{color:var(--p5)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;color:#2a0b14;background:linear-gradient(90deg,var(--p1),var(--p2));cursor:pointer;font-size:.9rem}
button:hover{filter:brightness(1.07)}
button.ghost{background:transparent;border:1px solid var(--p2);color:var(--p2)}
button.mini{padding:6px 10px;font-size:.75rem;border-radius:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{border:0;padding:6px 12px;border-radius:999px;font-size:.75rem;color:#111;font-weight:700;cursor:pointer}
.chip.off{opacity:.4}
#cuenta{color:var(--muted);font-size:.8rem;margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:#3a1019;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p4),var(--p1),var(--p2));color:#fff;font-weight:300;font-size:3rem}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.artist{font-weight:700;font-size:.9rem}
.title{color:var(--muted);font-size:.78rem;line-height:1.3}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.badge{padding:3px 9px;border-radius:999px;font-size:.7rem;font-weight:700;color:#111}
.price{font-weight:700;color:var(--p5);font-size:.9rem}
audio{width:100%;height:36px}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:.9rem}
pre{white-space:pre-wrap;background:#3a1019;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:.9rem;margin:0 0 10px}
</style>
</head>
<body>
<header><img class="logo" src="icon-512.png" alt="Spin The Vinyl Discos"></header>

<nav class="tabs">
  <button class="tab on" data-v="nuevo">Nuevo disco</button>
  <button class="tab" data-v="stock">Mi stock</button>
  <button class="tab" data-v="vidriera">Vidriera</button>
</nav>

<main>
  <section class="view on" id="v-nuevo">
    <div class="panel">
      <h2>Nuevo disco</h2>
      <div class="grid">
        <label>Artista<input id="artista" list="artistas" autocomplete="off" placeholder="Spinetta"></label>
        <label>Título<input id="titulo" list="titulos" autocomplete="off" placeholder="Artaud"></label>
        <datalist id="artistas"></datalist>
        <datalist id="titulos"></datalist>
        <label>Año<input id="anio" type="number" placeholder="1973"></label>
        <label>Precio (ARS)<input id="precio" type="number" placeholder="25000"></label>
        <label>Estado
          <select id="estado">
            <option value="M">M · Mint</option>
            <option value="NM">NM · Near Mint</option>
            <option value="VG+" selected>VG+ · Muy bueno</option>
            <option value="VG">VG · Bueno</option>
            <option value="G">G · Regular</option>
          </select>
        </label>
        <label>Edición o sello<input id="edicion" placeholder="Movieplay, reedición 2004"></label>
      </div>
      <div class="grid">
        <div class="fileBox">
          <span>Tapa (JPG o PNG)</span>
          <input type="file" id="fotoFile" accept="image/*">
          <small id="fotoNombre">Sin archivo</small>
          <input id="foto" type="url" placeholder="o pegá una URL">
        </div>
        <div class="fileBox">
          <span>Audio (MP3, máx. 2,5 MB)</span>
          <input type="file" id="audioFile" accept="audio/*">
          <small id="audioNombre">Sin archivo</small>
          <input id="audio" type="url" placeholder="o pegá una URL">
        </div>
      </div>
      <div class="actions">
        <button id="agregar">Agregar a la vidriera</button>
        <button class="ghost" id="limpiarForm">Limpiar</button>
      </div>
    </div>
  </section>

  <section class="view" id="v-stock">
    <div class="panel">
      <input id="buscar" class="search" type="search" placeholder="Buscar artista o título">
      <div class="chips" id="filtros"></div>
      <div class="chips"><span id="cuenta"></span></div>
      <div id="cards" class="cards"></div>
    </div>
  </section>

  <section class="view" id="v-vidriera">
    <div class="panel">
      <h2>Vidriera</h2>
      <pre id="vidriera"></pre>
      <div class="actions">
        <button id="copiar">Copiar para Instagram o WhatsApp</button>
        <button class="ghost" id="instalar" style="display:none">Instalar app</button>
      </div>
    </div>
  </section>
</main>

<script>
const ESTADOS={"M":{label:"Mint",color:"#2ec4b6"},"NM":{label:"Near Mint",color:"#7bd389"},"VG+":{label:"Muy bueno",color:"#ffd166"},"VG":{label:"Bueno",color:"#ff9f1c"},"G":{label:"Regular",color:"#ff4d6d"}};
const KEY="spin-the-vinyl-v1";
let discos=[],filtro=null,pendFoto="",pendAudio="",deferred=null;
const $=id=>document.getElementById(id);
const norm=s=>(s||"").trim().toLowerCase();
const fmt=n=>"$ "+Number(n).toLocaleString("es-AR");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

function cargar(){try{discos=JSON.parse(localStorage.getItem(KEY))||[]}catch{discos=[]}}
function guardar(){
  try{localStorage.setItem(KEY,JSON.stringify(discos));return true}
  catch{alert("No hay espacio en el navegador. Usá tapas más chicas o pegá URLs.");return false}
}

function ver(nombre){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.v===nombre));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+nombre));
  render();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>ver(b.dataset.v));

// Reduce la tapa a 600 px y la guarda como JPG liviano
function leerImagen(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,600/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}
function leerAudio(file){
  return new Promise((res,rej)=>{
    if(file.size>2.5*1024*1024){rej(new Error("pesado"));return;}
    const r=new FileReader();
    r.onload=()=>res(r.result);r.onerror=rej;
    r.readAsDataURL(file);
  });
}

$("fotoFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{pendFoto=await leerImagen(f);$("fotoNombre").textContent="✔ "+f.name}
  catch{alert("No se pudo leer la imagen.")}
};
$("audioFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{pendAudio=await leerAudio(f);$("audioNombre").textContent="✔ "+f.name}
  catch{alert("El audio pesa más de 2,5 MB. Usá un preview más corto o pegá una URL.");e.target.value="";}
};

// Sugerencias y autocompletado desde tu propio stock
function sugerencias(){
  $("artistas").innerHTML=[...new Set(discos.map(d=>d.artista))].sort().map(a=>`<option value="${esc(a)}">`).join("");
  const a=norm($("artista").value);
  $("titulos").innerHTML=[...new Set(discos.filter(d=>!a||norm(d.artista)===a).map(d=>d.titulo))].sort().map(t=>`<option value="${esc(t)}">`).join("");
}
function autocompletar(){
  const a=norm($("artista").value),t=norm($("titulo").value);
  if(!a||!t)return;
  const d=discos.find(x=>norm(x.artista)===a&&norm(x.titulo)===t);
  if(!d)return;
  if(!$("anio").value)$("anio").value=d.anio||"";
  if(!$("edicion").value)$("edicion").value=d.edicion||"";
  if(!pendFoto&&!$("foto").value&&d.foto){pendFoto=d.foto;$("fotoNombre").textContent="Tapa de tu stock";}
  if(!pendAudio&&!$("audio").value&&d.audio){pendAudio=d.audio;$("audioNombre").textContent="Audio de tu stock";}
}

function visibles(){
  const q=norm($("buscar").value);
  return discos.filter(d=>(!filtro||d.estado===filtro)&&(!q||norm(d.artista+" "+d.titulo).includes(q)));
}
function renderFiltros(){
  $("filtros").innerHTML="";
  Object.entries(ESTADOS).forEach(([k,v])=>{
    const b=document.createElement("button");
    b.className="chip"+(filtro&&filtro!==k?" off":"");
    b.style.background=v.color;b.textContent=k;
    b.onclick=()=>{filtro=filtro===k?null:k;render()};
    $("filtros").appendChild(b);
  });
}
function tarjeta(d){
  const c=document.createElement("article");c.className="card";
  const cover=document.createElement("div");cover.className="cover";
  cover.innerHTML=`<span>${esc((d.artista[0]||"?").toUpperCase())}</span>`;
  if(d.foto){const i=document.createElement("img");i.alt="";i.loading="lazy";i.src=d.foto;i.onerror=()=>i.remove();cover.appendChild(i);}
  const body=document.createElement("div");body.className="body";
  body.innerHTML=`<div class="artist">${esc(d.artista)}</div>
    <div class="title">${esc(d.titulo)}${d.anio?" · "+esc(d.anio):""}${d.edicion?" · "+esc(d.edicion):""}</div>
    <div class="meta"><span class="badge" style="background:${ESTADOS[d.estado]?.color||"#ccc"}">${esc(d.estado)}</span><span class="price">${fmt(d.precio)}</span></div>`;
  if(d.audio){const a=document.createElement("audio");a.controls=true;a.preload="none";a.src=d.audio;body.appendChild(a);}
  const del=document.createElement("button");del.className="mini ghost";del.textContent="Eliminar";
  del.onclick=()=>{if(confirm("¿Eliminar "+d.titulo+"?")){discos=discos.filter(x=>x.id!==d.id);guardar();render();}};
  body.appendChild(del);
  c.append(cover,body);
  return c;
}
function render(){
  sugerencias();renderFiltros();
  const l=visibles(),cont=$("cards");cont.innerHTML="";
  if(!discos.length)cont.innerHTML='<p class="empty">Todavía no cargaste discos. Andá a "Nuevo disco".</p>';
  else if(!l.length)cont.innerHTML='<p class="empty">Ningún disco coincide.</p>';
  else l.forEach(d=>cont.appendChild(tarjeta(d)));
  $("cuenta").textContent=`${l.length} de ${discos.length} discos`;
  $("vidriera").textContent=discos.length
    ?"🎶 Discos disponibles\n\n"+discos.map(d=>`• ${d.artista} - ${d.titulo}${d.anio?" ("+d.anio+")":""} | ${d.estado} | ${fmt(d.precio)}`).join("\n")+"\n\nConsultas por WhatsApp."
    :"Agregá discos para ver la vidriera.";
}

function limpiarForm(){
  ["artista","titulo","anio","precio","edicion","foto","audio"].forEach(i=>$(i).value="");
  $("estado").value="VG+";$("fotoFile").value="";$("audioFile").value="";
  pendFoto="";pendAudio="";
  $("fotoNombre").textContent="Sin archivo";$("audioNombre").textContent="Sin archivo";
}
$("agregar").onclick=()=>{
  const artista=$("artista").value.trim(),titulo=$("titulo").value.trim(),precio=parseFloat($("precio").value);
  if(!artista||!titulo||isNaN(precio)){alert("Completá artista, título y precio.");return;}
  discos.unshift({
    id:Date.now().toString(36),artista,titulo,
    anio:$("anio").value.trim(),precio,
    estado:$("estado").value,edicion:$("edicion").value.trim(),
    foto:pendFoto||$("foto").value.trim(),
    audio:pendAudio||$("audio").value.trim()
  });
  if(!guardar()){discos.shift();return;}
  limpiarForm();
  ver("stock");
};
$("limpiarForm").onclick=limpiarForm;
$("buscar").oninput=render;
$("artista").addEventListener("input",sugerencias);
$("artista").addEventListener("change",()=>{sugerencias();autocompletar();});
$("titulo").addEventListener("input",autocompletar);
$("titulo").addEventListener("change",autocompletar);

$("copiar").onclick=async()=>{
  try{
    await navigator.clipboard.writeText($("vidriera").textContent);
    $("copiar").textContent="¡Copiado!";
    setTimeout(()=>$("copiar").textContent="Copiar para Instagram o WhatsApp",1500);
  }catch{alert("No se pudo copiar. Seleccioná el texto a mano.");}
};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("instalar").style.display="inline-block";});
$("instalar").onclick=async()=>{
  if(!deferred)return;
  deferred.prompt();await deferred.userChoice;
  deferred=null;$("instalar").style.display="none";
};

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
cargar();render();
</script>
</body>
</html>
